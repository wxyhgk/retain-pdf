[package]
name = "retain-db"
version = "0.1.0"
edition = "2021"

[dependencies]
retain-core = { path = "../../backend/packages/retain-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
fastrand = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
