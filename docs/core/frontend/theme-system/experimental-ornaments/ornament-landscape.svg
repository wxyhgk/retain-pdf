<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" fill="none" aria-hidden="true">
  <!-- 右下远景：远山 + 亭 + 雾，宜低透明度使用 -->
  <g opacity="0.9">
    <!-- 远山层 -->
    <path d="M0 280 C120 240 200 250 300 230 C380 215 450 245 520 220 C600 190 680 210 780 185 C840 170 880 175 900 168 L900 420 L0 420 Z"
          fill="#8a9a8c" opacity="0.22"/>
    <path d="M80 310 C180 270 260 290 360 265 C440 245 510 275 590 250 C680 220 760 245 860 230 L900 240 L900 420 L0 420 Z"
          fill="#6b7d6e" opacity="0.2"/>
    <path d="M200 340 C300 300 380 320 480 300 C560 285 640 310 740 295 C800 285 860 300 900 295 L900 420 L0 420 Z"
          fill="#5a6b5c" opacity="0.18"/>
    <!-- 近雾带 -->
    <ellipse cx="620" cy="300" rx="220" ry="36" fill="#f7f3eb" opacity="0.35"/>
    <ellipse cx="400" cy="330" rx="180" ry="28" fill="#f7f3eb" opacity="0.28"/>
    <!-- 亭（简化） -->
    <g transform="translate(640 200)" stroke="#4a5c4e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
      <path d="M-28 42 L28 42"/>
      <path d="M-22 42 L-22 22 M22 42 L22 22"/>
      <path d="M-30 22 L0 6 L30 22 Z" fill="#5a6b5c" fill-opacity="0.25"/>
      <path d="M-34 24 L0 4 L34 24"/>
      <path d="M-8 42 L-8 26 M8 42 L8 26"/>
      <path d="M0 6 L0 0" stroke-width="1"/>
      <circle cx="0" cy="-2" r="1.5" fill="#4a5c4e"/>
    </g>
    <!-- 远亭更淡 -->
    <g transform="translate(480 230) scale(0.7)" stroke="#6b7d6e" stroke-width="1" fill="none" opacity="0.35">
      <path d="M-20 30 L20 30"/>
      <path d="M-16 30 L-16 16 M16 30 L16 16"/>
      <path d="M-22 16 L0 4 L22 16"/>
    </g>
    <!-- 水岸线 -->
    <path d="M120 370 C250 355 400 380 550 360 C700 340 820 355 900 350"
          stroke="#7a8c7c" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
  </g>
</svg>
