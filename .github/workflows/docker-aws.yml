name: Docker AWS ECR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (e.g. 1.0.0)'
        required: true
        type: string
        default: latest
      aws_region:
        description: 'AWS Region'
        required: true
        type: choice
        options:
          - us-east-1
          - us-west-2
          - eu-west-1
          - ap-southeast-1
          - ap-northeast-1
        default: ap-southeast-1

env:
  AWS_REGION: ${{ inputs.aws_region }}
  ECR_NAMESPACE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/estar

jobs:
  build-amd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: app
            file: docker/Dockerfile.app
            repo: retainpdf-app
          - name: web
            file: docker/Dockerfile.web
            repo: retainpdf-web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.file }}
          tags: ${{ env.ECR_NAMESPACE }}/${{ matrix.target.repo }}:${{ inputs.version }}
          push: true
          platforms: linux/amd64
          no-cache: true
          provenance: false
          pull: false
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}@${{ steps.base_build.outputs.digest }}
            RETAIN_PDF_VERSION=${{ inputs.version }}