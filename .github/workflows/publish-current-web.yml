name: Publish Current Web Image

"on":
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated)"
        required: false
        default: "linux/amd64,linux/arm64"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/publish-current-web.yml"
      - "docker/Dockerfile.web"
      - "docker/entrypoint-web.sh"
      - "docker/nginx-mjs.types.conf"
      - "docker/nginx.conf.template"
      - "frontend/**"

jobs:
  publish-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker Hub namespace
        id: hub
        shell: bash
        run: |
          user="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$user" ]; then
            user="${GITHUB_REPOSITORY_OWNER}"
          fi
          echo "user=${user}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.hub.outputs.user }}/retainpdf-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=current-

      - name: Resolve frontend version
        id: frontend-version
        shell: bash
        run: |
          version="$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)"
          version="${version#v}"
          if [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+[^-]*)-([0-9]+)-g([0-9a-f]+)(-dirty)?$ ]]; then
            suffix=""
            if [ -n "${BASH_REMATCH[4]:-}" ]; then
              suffix=".dirty"
            fi
            version="${BASH_REMATCH[1]}+${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}${suffix}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push current frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          build-args: |
            RETAIN_PDF_VERSION=${{ steps.frontend-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
