name: Publish desktop release
description: >-
  Verify a complete three-platform desktop package set against its manifests,
  write SHA256SUMS.txt, re-check that the tag still targets this revision, and
  publish the GitHub Release. Shared by the full-build fallback and the
  prebuild-promotion paths of release-desktop.yml so both publish identically.

inputs:
  assets-dir:
    description: Directory holding the three packages and their desktop-package-<platform>.json manifests.
    required: true
  version:
    description: Release version without the leading v.
    required: true
  tag:
    description: Release tag name (the pushed tag).
    required: true
  prerelease:
    description: "'true' for prerelease tags."
    required: true
  revision:
    description: Commit the release must be built from (the tag's commit).
    required: true

runs:
  using: composite
  steps:
    # 硬门禁：三平台齐全、manifest 的版本 / revision / 文件名与本次发布一致、
    # 每个安装包和自动更新附带文件（latest*.yml、.blockmap、Mac 的 zip）的大小与 sha256
    # 和 manifest 一致；同时写出 SHA256SUMS.txt。
    - name: Verify complete desktop release set
      shell: bash
      env:
        ASSETS_DIR: ${{ inputs.assets-dir }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_REVISION: ${{ inputs.revision }}
      run: |
        find "$ASSETS_DIR" -maxdepth 1 -type f -print | sort
        python3 "$GITHUB_WORKSPACE/.github/scripts/release_candidate_manifest.py" verify-desktop \
          --dir "$ASSETS_DIR" \
          --version "$RELEASE_VERSION" \
          --revision "$RELEASE_REVISION" \
          --check-files \
          --require-extras \
          --sums-out "$ASSETS_DIR/SHA256SUMS.txt"
        cat "$ASSETS_DIR/SHA256SUMS.txt"

    - name: Verify release tag still targets this revision
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_REVISION: ${{ inputs.revision }}
      run: |
        head_sha="$(git rev-parse HEAD)"
        remote_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 { print $1 }')"
        if [ -z "$remote_sha" ]; then
          remote_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"
        fi
        if [ "$head_sha" != "$RELEASE_REVISION" ] || [ "$remote_sha" != "$RELEASE_REVISION" ]; then
          echo "Release tag moved while this run was building: head=$head_sha remote=$remote_sha expected=$RELEASE_REVISION" >&2
          exit 1
        fi

    # GitHub 的 Assets 只按文件名字母序排、不能调顺序，latest*.yml 总排在安装包前面；
    # 说明里放一张三个安装包的下载表，并写明自动更新用的文件不用下（2026-11-23 用户定）。
    - name: Write release notes download table
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_TAG: ${{ inputs.tag }}
        REPOSITORY: ${{ github.repository }}
      run: |
        base="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}"
        v="$RELEASE_VERSION"
        notes="$RUNNER_TEMP/desktop-release-notes.md"
        {
          echo "## 下载 / Download"
          echo
          echo "| 系统 / System | 安装包 / Installer |"
          echo "| --- | --- |"
          echo "| Windows | [RetainPDF-Windows-${v}-Setup.exe](${base}/RetainPDF-Windows-${v}-Setup.exe) |"
          echo "| macOS（Apple 芯片 / Apple silicon） | [RetainPDF-Mac-${v}.dmg](${base}/RetainPDF-Mac-${v}.dmg) |"
          echo "| Linux | [RetainPDF-Linux-${v}.deb](${base}/RetainPDF-Linux-${v}.deb) |"
          echo
          echo '下面 Assets 里的 `latest*.yml`、`.zip`、`.blockmap` 是软件自动更新用的，不用下载；`SHA256SUMS.txt` 用来校验下载的文件。'
          echo
          echo 'The `latest*.yml`, `.zip` and `.blockmap` files below are for in-app auto-update; you don'"'"'t need to download them. `SHA256SUMS.txt` lets you verify the downloads.'
        } > "$notes"
        cat "$notes"

    - name: Publish complete desktop release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ github.token }}
        tag_name: ${{ inputs.tag }}
        prerelease: ${{ inputs.prerelease == 'true' }}
        body_path: ${{ runner.temp }}/desktop-release-notes.md
        fail_on_unmatched_files: true
        files: |
          ${{ inputs.assets-dir }}/RetainPDF-Windows-${{ inputs.version }}-Setup.exe
          ${{ inputs.assets-dir }}/RetainPDF-Windows-${{ inputs.version }}-Setup.exe.blockmap
          ${{ inputs.assets-dir }}/latest.yml
          ${{ inputs.assets-dir }}/RetainPDF-Linux-${{ inputs.version }}.deb
          ${{ inputs.assets-dir }}/RetainPDF-Mac-${{ inputs.version }}.dmg
          ${{ inputs.assets-dir }}/RetainPDF-Mac-${{ inputs.version }}.zip
          ${{ inputs.assets-dir }}/RetainPDF-Mac-${{ inputs.version }}.zip.blockmap
          ${{ inputs.assets-dir }}/latest-mac.yml
          ${{ inputs.assets-dir }}/SHA256SUMS.txt
