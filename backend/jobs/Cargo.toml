[package]
name = "retain-jobsd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "retain-jobsd"
path = "src/main.rs"

[dependencies]
retain-core = { path = "../packages/retain-core" }
retain-data = { path = "../packages/retain-data" }
retain-jobs = { path = "../packages/retain-jobs" }
anyhow = "1"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
sha2 = "0.11.0"
