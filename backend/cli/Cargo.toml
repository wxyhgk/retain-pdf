[package]
name = "retainpdf-cli"
version = "0.1.0"
edition = "2021"
description = "RetainPDF 命令行:配置、状态、环境检查、备份、同步"

[[bin]]
name = "retainpdf"
path = "src/main.rs"

[dependencies]
retain-config = { path = "../packages/retain-config" }
retain-core = { path = "../packages/retain-core" }
retain-data = { path = "../packages/retain-data" }
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
