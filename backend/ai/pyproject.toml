[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainpdf-ai-service"
version = "0.1.0"
description = "RetainPDF local agentic document service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "pydantic>=2.0,<3",
  "uvicorn>=0.30.0,<1",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]

[project.scripts]
retainpdf-ai = "retainpdf_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["retainpdf_ai*"]
