[package]
name = "retainpdf-data"
version = "0.1.0"
edition = "2021"

[dependencies]
retainpdf-db = { path = "../../../database/retainpdf-db" }
retainpdf-core = { path = "../retainpdf-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
fastrand = "2"
flate2 = "1"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream", "multipart"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
