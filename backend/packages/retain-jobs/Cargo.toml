[package]
name = "retain-jobs"
version = "0.1.0"
edition = "2021"

[dependencies]
retain-core = { path = "../retain-core" }
retain-data = { path = "../retain-data" }
retain-proc = { path = "../retain-proc" }
anyhow = "1"
base64 = "0.22"
fastrand = "2"
getrandom = "0.2"
libc = "0.2"
lopdf = "0.32"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
