[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainpdf-table-agent"
version = "4.2.6"
description = "RetainPDF table agent: translates one table at a time in a bounded loop, checks every cell, and keeps the original table when it cannot finish"
requires-python = ">=3.11,<3.12"
# 核心 retainpdf_table_agent 不依赖第三方库：模型调用、截图、排版都由调用方传进来（函数），测试钉着。
dependencies = []

[project.optional-dependencies]
# 接线 retainpdf_table_agent_engine：接翻译底座的模型调用。流水线的表格翻译阶段装它。
engine = [
  "retainpdf-translation",
]
test = [
  "pytest==9.0.3",
]

[tool.uv.sources]
retainpdf-translation = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = [
  "retainpdf_table_agent",
  "retainpdf_table_agent.prompts",
  "retainpdf_table_agent_engine",
]

[tool.setuptools.package-data]
"retainpdf_table_agent.prompts" = ["*.txt"]
