[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainpdf-translation-classic"
version = "4.2.6"
description = "RetainPDF classic translation engine (batch block-by-block translation, repair, preparation, refine, editorial)"
requires-python = ">=3.11,<3.12"
dependencies = [
  # 底座：读文档、接续段、页面策略、回填、断点、请求层、提示词（2026-11-20 从 retainpdf-translation 拆出来，依赖它，它不依赖这里）
  "retainpdf-base",
  "retainpdf-math",
  "retainpdf-translation",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]

[tool.uv.sources]
retainpdf-base = { workspace = true }
retainpdf-math = { workspace = true }
retainpdf-translation = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = [
  "retainpdf_translation_classic*",
]
