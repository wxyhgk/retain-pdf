[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainpdf-translation-agent"
version = "4.2.6"
description = "RetainPDF translation agent: translates a page of classified blocks with an LLM, checks every block, and revises blocks on request from the layout agent"
requires-python = ">=3.11,<3.12"
# 不依赖第三方库：调模型用标准库 urllib，这样任何阶段都能放心装它。
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "retainpdf_translation_agent*",
]
