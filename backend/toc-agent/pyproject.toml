[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainpdf-toc-agent"
version = "4.2.6"
description = "RetainPDF table-of-contents agent: translates a book's contents entries in one pass, checks every entry, and pins the same wording onto the matching body headings"
requires-python = ">=3.11,<3.12"
# 核心 retainpdf_toc_agent 不依赖第三方库：模型调用由调用方传进来（函数），测试钉着。
dependencies = []

[project.optional-dependencies]
# 接线 retainpdf_toc_agent_engine：接翻译底座的模型调用、从 document.v1 取条目和标题。流水线的翻译阶段装它。
engine = [
  "retainpdf-translation",
]
test = [
  "pytest==9.0.3",
]

[tool.uv.sources]
retainpdf-translation = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = [
  "retainpdf_toc_agent",
  "retainpdf_toc_agent.context",
  "retainpdf_toc_agent.prompts",
  "retainpdf_toc_agent_engine",
]

[tool.setuptools.package-data]
"retainpdf_toc_agent.prompts" = ["*.txt"]
