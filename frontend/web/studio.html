<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RetainPDF · Theme Studio</title>
<!-- 主题工作台（仅开发环境使用，不进生产分发）：
     M1 点选检查/调 token/导出皮肤 · M2 LLM 配色提案 · M3 gpt-image-2 生图入 slot
     文档：docs/core/frontend/theme-system/DECOR_PACKS.md · 资产规格：decor/<pack>/ASSETS.md -->
<style>
  :root { --st-bg:#17181b; --st-panel:#1f2126; --st-ink:#e8e6e3; --st-mut:#9a9590; --st-line:#2c3238; --st-acc:#e0447a; }
  * { box-sizing:border-box; margin:0; }
  body { display:grid; grid-template-columns: 1fr 340px; grid-template-rows: 48px 1fr; height:100vh;
         background:var(--st-bg); color:var(--st-ink); font:13px/1.5 ui-sans-serif,system-ui; }
  header { grid-column:1/3; display:flex; align-items:center; gap:12px; padding:0 14px;
           border-bottom:1px solid var(--st-line); }
  header h1 { font-size:14px; margin-right:8px; }
  header .spacer { flex:1; }
  select,input[type=text] { background:var(--st-panel); color:var(--st-ink); border:1px solid var(--st-line);
           border-radius:6px; padding:4px 8px; font-size:12px; }
  button { background:var(--st-panel); color:var(--st-ink); border:1px solid var(--st-line);
           border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
  button:hover { border-color:var(--st-mut); }
  button.active,#export-btn { background:var(--st-acc); border-color:var(--st-acc); color:#fff; }
  #stage-wrap { position:relative; overflow:hidden; }
  #stage-frame { width:100%; height:100%; border:0; background:#fff; }
  aside { border-left:1px solid var(--st-line); overflow-y:auto; padding:10px 12px; background:var(--st-panel); }
  aside h3 { font-size:11px; letter-spacing:.08em; color:var(--st-mut); margin:14px 0 6px; text-transform:uppercase; }
  .focus-head { background:rgba(224,68,122,.14); border:1px solid var(--st-acc); border-radius:6px;
                padding:6px 8px; font-size:12px; margin-bottom:6px; }
  .token-row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .token-row label { flex:1; font-family:ui-monospace,monospace; font-size:11px; color:var(--st-mut);
                     overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .token-row label.dirty { color:var(--st-acc); }
  .token-row input[type=text] { width:150px; font-family:ui-monospace,monospace; font-size:11px; }
  .token-row input[type=color] { width:26px; height:26px; padding:0; border:1px solid var(--st-line);
                                 border-radius:5px; background:none; }
  #contrast-box .pair { font-family:ui-monospace,monospace; font-size:11px; padding:1px 0; }
  #contrast-box .ok { color:#6bc48a; } #contrast-box .bad { color:#e07068; }
  dialog { background:var(--st-panel); color:var(--st-ink); border:1px solid var(--st-line);
           border-radius:10px; width:min(720px,90vw); }
  dialog textarea { width:100%; height:340px; background:var(--st-bg); color:var(--st-ink);
           border:1px solid var(--st-line); border-radius:6px; font:11px/1.5 ui-monospace,monospace; padding:8px; }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  .dlg-foot { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>🎨 Theme Studio</h1>
  <label>基准皮肤
    <select id="base-theme">
      <option value="classic">classic 经典</option>
      <option value="jiangnan">jiangnan 素纸</option>
      <option value="seacliff">seacliff 雾青</option>
      <option value="night">night 黛瓦夜色</option>
    </select>
  </label>
  <label>草稿 id <input type="text" id="draft-name" value="draft" size="10" /></label>
  <button id="pick-btn">🎯 点选元素</button>
  <button id="reset-btn">还原</button>
  <span class="spacer"></span>
  <span id="dirty-count" style="color:var(--st-mut)">0 项改动</span>
  <button id="export-btn">导出皮肤</button>
</header>

<div id="stage-wrap">
  <iframe id="stage-frame" src="./index.html?mock=1" title="主页预览"></iframe>
</div>

<aside>
  <div id="token-panel"></div>
  <div id="contrast-box"></div>
</aside>

<dialog id="export-dialog">
  <h3 style="margin-bottom:8px">导出：themes/&lt;id&gt;.css + registry 片段</h3>
  <textarea id="export-out" readonly></textarea>
  <div class="dlg-foot">
    <button id="copy-btn">复制全部</button>
    <button id="download-btn">下载 .css</button>
    <button onclick="this.closest('dialog').close()">关闭</button>
  </div>
</dialog>

<script type="module" src="./studio/studio.mjs"></script>
</body>
</html>
