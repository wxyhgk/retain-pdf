<main>
  <h1>{{name}}</h1>
  <p id="article">…</p>
  <button id="insert">插一句话进文章</button>
</main>
<style>
  main { padding: 16px; }
  h1 { margin: 0 0 8px; font-size: 18px; }
</style>
<script>
  // 一页网页的小程序：改了保存，窗口自己重新加载。studio.* 能做什么见技能 studio-mini-apps。
  const article = document.querySelector('#article');
  studio.article().then(
    (shown) => { article.textContent = `当前文章：${shown.title}`; },
    () => { article.textContent = '还没有打开文章'; },
  );
  document.querySelector('#insert').addEventListener('click', () => studio.insert('这是小程序「{{name}}」插进来的一句话。'));
</script>
