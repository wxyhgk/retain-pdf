<style>
	body { padding: 14px; }
	.input { display: flex; gap: 8px; }
	.input input { flex: 1; min-width: 0; }
	table { width: 100%; margin-top: 14px; border-collapse: collapse; }
	td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
	td.value { font-variant-numeric: tabular-nums; text-align: right; }
	td.unit { width: 84px; padding-left: 10px; color: var(--muted); }
	td.insert { width: 46px; text-align: right; }
	td.insert button { padding: 1px 8px; font-size: 12px; }
	p { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
</style>
<div class="input">
	<input id="value" type="text" inputmode="decimal" value="1" aria-label="数值" />
	<select id="unit" aria-label="单位"></select>
</div>
<table id="results"></table>
<p>点「插入」，在正文光标处插入这个值（mhchem 的 \pu 写法）。CODATA 2018。</p>
<script>
	// How many of each unit one Hartree is (CODATA 2018).
	const UNITS = [
		{ id: 'Eh', label: 'Hartree', per: 1, pu: 'E_h' },
		{ id: 'eV', label: 'eV', per: 27.211386245988, pu: 'eV' },
		{ id: 'kcal', label: 'kcal/mol', per: 627.5094740631, pu: 'kcal.mol-1' },
		{ id: 'kJ', label: 'kJ/mol', per: 2625.4996394799, pu: 'kJ.mol-1' },
		{ id: 'cm', label: 'cm⁻¹', per: 219474.6313632, pu: 'cm-1' },
	];
	const value = document.getElementById('value');
	const unit = document.getElementById('unit');
	const results = document.getElementById('results');
	for (const each of UNITS) unit.append(new Option(each.label, each.id));
	unit.value = 'kcal';

	/** A number as written in a paper: about six significant figures, no trailing zeros. */
	const shown = (number) => (Math.abs(number) >= 1e6 || (Math.abs(number) < 1e-3 && number !== 0) ? number.toExponential(5) : String(Number(number.toPrecision(6))));

	function draw() {
		const from = UNITS.find((each) => each.id === unit.value);
		const number = Number(value.value.replace('−', '-'));
		results.replaceChildren();
		if (!Number.isFinite(number)) return;
		const hartree = number / from.per;
		for (const each of UNITS) {
			const row = results.insertRow();
			const text = shown(hartree * each.per);
			row.insertCell().textContent = text;
			row.cells[0].className = 'value';
			row.insertCell().textContent = each.label;
			row.cells[1].className = 'unit';
			const cell = row.insertCell();
			cell.className = 'insert';
			const button = document.createElement('button');
			button.textContent = '插入';
			button.addEventListener('click', () => studio.insert(each.id === 'Eh' ? `$${text}\\,E_\\mathrm{h}$` : `$\\pu{${text} ${each.pu}}$`).catch((error) => studio.toast(error.message)));
			cell.append(button);
		}
	}
	value.addEventListener('input', draw);
	unit.addEventListener('change', draw);
	draw();
</script>
