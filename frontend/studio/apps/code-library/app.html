<style>
	html, body { height: 100%; }
	body { display: grid; grid-template-rows: auto minmax(0, 1fr); font-size: 13px; }
	[hidden] { display: none !important; }
	.tabs { display: flex; gap: 2px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); }
	.tab { margin-bottom: -1px; padding: 6px 12px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); font-size: 13px; }
	.tab[aria-selected='true'] { border-bottom-color: var(--ink); color: var(--ink); font-weight: 600; }
	#snippets { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
	#repos { min-height: 0; overflow-y: auto; }
	button { font-size: 12px; }
	.top { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
	.search { position: relative; flex: 1; min-width: 0; }
	.search input { width: 100%; box-sizing: border-box; height: 32px; padding: 4px 10px 4px 30px; border-radius: 8px; background: var(--soft); border-color: transparent; }
	.search input:focus { outline: none; border-color: var(--line); background: var(--surface); }
	.search svg { position: absolute; left: 10px; top: 9px; width: 14px; height: 14px; color: var(--muted); }
	.count { flex: none; color: var(--muted); font-size: 12px; }
	.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 14px 10px; border-bottom: 1px solid var(--line); }
	.chip { padding: 2px 10px; border-radius: 999px; border-color: var(--line); color: var(--muted); }
	.chip[aria-pressed='true'] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
	.chip small { margin-left: 4px; opacity: 0.7; font-size: 11px; }
	.gap { flex: 1; }
	.filters label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
	.filters select { padding: 2px 6px; font-size: 12px; }

	.main { display: grid; grid-template-columns: minmax(300px, 40%) minmax(0, 1fr); min-height: 0; }
	.list { overflow-y: auto; border-right: 1px solid var(--line); }
	.item { display: grid; gap: 3px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
	.item:hover { background: var(--soft); }
	.item[aria-selected='true'] { background: var(--soft); box-shadow: inset 2px 0 0 var(--ink); }
	.item .head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
	.item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
	.lang { flex: none; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-size: 11px; line-height: 17px; }
	.item pre { margin: 0; overflow: hidden; color: var(--muted); font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; max-height: 3em; }
	.where { overflow: hidden; color: var(--muted); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
	.many { flex: none; color: var(--ink); font-size: 11px; }
	mark { background: color-mix(in srgb, var(--ink) 14%, transparent); color: inherit; border-radius: 2px; }

	.detail { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
	.detail-head { display: grid; gap: 6px; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
	.detail-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
	.detail-title strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
	.actions { display: flex; flex-wrap: wrap; gap: 6px; }
	.actions .primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
	.back { display: none; }
	.code { margin: 0; overflow: auto; padding: 10px 0; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; counter-reset: line; }
	.code span.l { display: block; padding: 0 16px 0 0; white-space: pre; }
	.code span.l::before { counter-increment: line; content: counter(line); display: inline-block; width: 3.2em; margin-right: 14px; color: var(--muted); opacity: 0.6; text-align: right; user-select: none; }
	.code .c { color: var(--muted); }
	.places { display: flex; flex-direction: column; gap: 2px; max-height: 168px; overflow-y: auto; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
	.places > span { flex: none; padding: 0 6px 4px; color: var(--muted); font-size: 11.5px; }
	.place { flex: none; display: block; width: 100%; padding: 5px 6px; overflow: hidden; border: 0; border-radius: 6px; background: none; line-height: 1.5; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
	.place:hover { background: var(--soft); }
	.place small { margin-left: 6px; color: var(--muted); }
	.empty { display: grid; place-items: center; height: 100%; padding: 24px; color: var(--muted); text-align: center; }

	@media (max-width: 720px) {
		.main { grid-template-columns: minmax(0, 1fr); }
		.detail { display: none; }
		body.reading .list { display: none; }
		body.reading .detail { display: grid; }
		.back { display: inline-block; }
	}
</style>

<link rel="stylesheet" href="./repos.css" />
<nav class="tabs" role="tablist">
	<button class="tab" role="tab" id="tab-repos" aria-selected="true">仓库</button>
	<button class="tab" role="tab" id="tab-snippets" aria-selected="false">片段</button>
</nav>
<section id="repos" role="tabpanel"></section>
<section id="snippets" role="tabpanel" hidden>
<div class="top">
	<label class="search">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
		<input id="query" type="search" placeholder="搜代码、笔记标题、小标题、文件名（/ 键）" autocomplete="off" spellcheck="false" />
	</label>
	<span class="count" id="count"></span>
</div>
<div class="filters">
	<span id="languages" style="display: contents"></span>
	<span class="gap"></span>
	<label><input type="checkbox" id="blocks" checked /> 代码块</label>
	<label><input type="checkbox" id="files" checked /> 脚本文件</label>
	<label><input type="checkbox" id="others" /> 插件块和运行结果</label>
	<select id="order" aria-label="排序">
		<option value="recent">最近改过的在前</option>
		<option value="note">按笔记</option>
		<option value="many">出现次数多的在前</option>
		<option value="long">长的在前</option>
	</select>
</div>
<div class="main">
	<div class="list" id="list" role="listbox" aria-label="代码"></div>
	<section class="detail" id="detail"></section>
</div>
</section>
<script type="module" src="./repos.js"></script>

<script>
	/** Languages as one: what the fences and the files call them. */
	const ALIASES = { py: 'python', python3: 'python', sh: 'shell', bash: 'shell', zsh: 'shell', console: 'shell', shell: 'shell', js: 'javascript', mjs: 'javascript', ts: 'typescript', gjf: 'gaussian', com: 'gaussian', f90: 'fortran', 'c++': 'cpp' };
	const NAMES = { python: 'Python', shell: 'Shell', javascript: 'JavaScript', typescript: 'TypeScript', gaussian: 'Gaussian', orca: 'ORCA', fortran: 'Fortran', cpp: 'C++', c: 'C', julia: 'Julia', r: 'R', matlab: 'MATLAB', json: 'JSON', html: 'HTML', xml: 'XML', input: '输入文件', incar: 'INCAR', poscar: 'POSCAR', kpoints: 'KPOINTS', cp2k: 'CP2K', output: '运行结果', '': '无语言' };
	const language = (item) => ALIASES[item.language] ?? item.language;
	const languageName = (name) => NAMES[name] ?? name;
	/** Where a comment starts, by language: drawn grey. */
	const COMMENT = { python: '#', shell: '#', r: '#', julia: '#', perl: '#', ruby: '#', javascript: '//', typescript: '//', c: '//', cpp: '//', rust: '//', go: '//', java: '//', fortran: '!', orca: '#' };

	const $ = (id) => document.getElementById(id);
	const state = { items: [], query: '', language: '', blocks: true, files: true, others: false, order: 'recent', selected: null };
	try {
		Object.assign(state, JSON.parse(localStorage.getItem('code-library.filters') ?? '{}'));
	} catch {}
	const keep = () => localStorage.setItem('code-library.filters', JSON.stringify({ blocks: state.blocks, files: state.files, others: state.others, order: state.order }));

	/** The first line worth naming it by: not empty, not only a comment's mark. */
	const firstLine = (text) => text.split('\n').map((line) => line.trim()).find((line) => line && !/^(#!|[#/!*-]+\s*$)/u.test(line)) ?? '';
	const nameOf = (item) => item.title || firstLine(item.text).replace(/^(#|\/\/|!)\s*/u, '').slice(0, 80) || '（空）';
	const words = () => state.query.toLowerCase().split(/\s+/u).filter(Boolean);
	const haystack = (item) => (item.hay ??= [item.text, item.title, item.language, languageName(language(item)), ...item.places.flatMap((place) => [place.title, place.heading, place.path ?? ''])].join('\n').toLowerCase());

	/** When, as one says it. */
	function when(time) {
		const days = Math.floor((Date.now() - time) / 86400000);
		if (days <= 0) return '今天';
		if (days === 1) return '昨天';
		if (days < 30) return `${days} 天前`;
		return new Date(time).toISOString().slice(0, 10);
	}

	/** Text with the words searched for marked, safely. */
	function marked(text) {
		const element = document.createElement('span');
		const wanted = words();
		if (!wanted.length) {
			element.textContent = text;
			return element;
		}
		const pattern = new RegExp(wanted.map((word) => word.replace(/[.*+?^${}()|[\]\\]/gu, '\\$&')).join('|'), 'giu');
		let at = 0;
		for (const match of text.matchAll(pattern)) {
			element.append(text.slice(at, match.index));
			const mark = document.createElement('mark');
			mark.textContent = match[0];
			element.append(mark);
			at = match.index + match[0].length;
		}
		element.append(text.slice(at));
		return element;
	}

	/** Its lines shown in the list: those around what was searched for, else its first. */
	function preview(item) {
		const lines = item.text.split('\n');
		const wanted = words();
		const hit = wanted.length ? lines.findIndex((line) => wanted.some((word) => line.toLowerCase().includes(word))) : -1;
		const from = hit > 0 ? hit : lines.findIndex((line) => line.trim());
		return lines.slice(Math.max(0, from), Math.max(0, from) + 2).join('\n');
	}

	const whereOf = (place) => `《${place.title}》${place.heading ? ` › ${place.heading}` : ''}${place.path ? ` · ${place.path}` : place.line ? ` · 第 ${place.line} 行` : ''}`;

	/** Those of the kinds asked for (code blocks, script files, the others). */
	const ofKinds = () =>
		state.items.filter((item) => {
			if (item.kind === 'block') return state.blocks;
			if (item.kind === 'file') return state.files;
			return state.others;
		});

	function shown() {
		const wanted = words();
		const list = ofKinds().filter((item) => (!state.language || language(item) === state.language) && wanted.every((word) => haystack(item).includes(word)));
		const by = {
			recent: (a, b) => b.modified - a.modified,
			note: (a, b) => a.places[0].title.localeCompare(b.places[0].title, 'zh-CN') || (a.places[0].line ?? 0) - (b.places[0].line ?? 0),
			many: (a, b) => b.places.length - a.places.length || b.modified - a.modified,
			long: (a, b) => b.lines - a.lines,
		}[state.order];
		return list.sort(by);
	}

	/** The chips of the languages, each with how many there are (of what the other filters let through). */
	function drawLanguages() {
		const counts = new Map();
		for (const item of ofKinds()) counts.set(language(item), (counts.get(language(item)) ?? 0) + 1);
		const chip = (name, label, count) => {
			const button = document.createElement('button');
			button.className = 'chip';
			button.setAttribute('aria-pressed', String(state.language === name));
			button.append(label);
			const small = document.createElement('small');
			small.textContent = count;
			button.append(small);
			button.addEventListener('click', () => {
				state.language = state.language === name || !name ? '' : name;
				draw();
			});
			return button;
		};
		const total = [...counts.values()].reduce((a, b) => a + b, 0);
		$('languages').replaceChildren(chip('', '全部', total), ...[...counts].sort((a, b) => b[1] - a[1]).map(([name, count]) => chip(name, languageName(name), count)));
	}

	function drawList(list) {
		const box = $('list');
		box.replaceChildren();
		if (!list.length) {
			const empty = document.createElement('div');
			empty.className = 'empty';
			empty.textContent = state.items.length ? '没有符合的代码' : '笔记里还没有代码';
			box.append(empty);
			return;
		}
		for (const item of list.slice(0, 600)) {
			const row = document.createElement('div');
			row.className = 'item';
			row.role = 'option';
			row.dataset.id = item.id;
			row.setAttribute('aria-selected', String(item.id === state.selected));
			const head = document.createElement('div');
			head.className = 'head';
			const lang = document.createElement('span');
			lang.className = 'lang';
			lang.textContent = item.kind === 'file' ? `${languageName(language(item))} 文件` : languageName(language(item));
			const name = document.createElement('span');
			name.className = 'name';
			name.append(marked(nameOf(item)));
			head.append(lang, name);
			if (item.places.length > 1) {
				const many = document.createElement('span');
				many.className = 'many';
				many.textContent = `出现在 ${new Set(item.places.map((place) => place.slug)).size} 篇`;
				head.append(many);
			}
			const code = document.createElement('pre');
			code.append(marked(preview(item)));
			const where = document.createElement('div');
			where.className = 'where';
			where.textContent = `${whereOf(item.places[0])} · ${item.lines} 行 · ${when(item.modified)}`;
			row.append(head, code, where);
			row.addEventListener('click', () => select(item.id));
			row.addEventListener('dblclick', () => jump(item, item.places[0]));
			box.append(row);
		}
	}

	/** The code drawn line by line, comments grey, what was searched for marked. */
	function codeLines(item) {
		const pre = document.createElement('pre');
		pre.className = 'code';
		const mark = COMMENT[language(item)];
		for (const line of item.text.replace(/\n$/u, '').split('\n')) {
			const span = document.createElement('span');
			span.className = 'l';
			const at = mark ? line.indexOf(mark) : -1;
			// A comment: from its mark, when nothing but spaces comes before it (no guessing inside strings).
			if (at >= 0 && !line.slice(0, at).trim()) {
				const grey = document.createElement('span');
				grey.className = 'c';
				grey.append(marked(line));
				span.append(grey);
			} else span.append(marked(line || ' '));
			pre.append(span);
		}
		return pre;
	}

	function drawDetail(item) {
		const detail = $('detail');
		detail.replaceChildren();
		if (!item) {
			const empty = document.createElement('div');
			empty.className = 'empty';
			empty.textContent = '选一段代码看全文';
			detail.append(empty);
			return;
		}
		const head = document.createElement('div');
		head.className = 'detail-head';
		const title = document.createElement('div');
		title.className = 'detail-title';
		const back = document.createElement('button');
		back.className = 'back';
		back.textContent = '‹ 列表';
		back.addEventListener('click', () => document.body.classList.remove('reading'));
		const lang = document.createElement('span');
		lang.className = 'lang';
		lang.textContent = languageName(language(item));
		const strong = document.createElement('strong');
		strong.textContent = nameOf(item);
		strong.title = nameOf(item);
		title.append(back, lang, strong);
		const actions = document.createElement('div');
		actions.className = 'actions';
		const button = (label, run, primary = false) => {
			const element = document.createElement('button');
			element.textContent = label;
			if (primary) element.className = 'primary';
			element.addEventListener('click', run);
			actions.append(element);
		};
		button('复制', () => copy(item.text), true);
		button('跳到笔记', () => jump(item, item.places[0]));
		button('插入到当前文章', () => studio.insert(`\`\`\`${item.language || ''}\n${item.text.replace(/\n$/u, '')}\n\`\`\``).then(() => studio.toast('已插入'), (error) => studio.toast(error.message)));
		head.append(title, actions);
		const places = document.createElement('div');
		places.className = 'places';
		const caption = document.createElement('span');
		caption.textContent = `${item.lines} 行 · 在 ${item.places.length} 处（点一处跳过去）`;
		places.append(caption);
		for (const place of item.places) {
			const row = document.createElement('button');
			row.className = 'place';
			row.textContent = whereOf(place);
			const small = document.createElement('small');
			small.textContent = when(place.modified);
			row.append(small);
			row.addEventListener('click', () => jump(item, place));
			places.append(row);
		}
		detail.append(head, codeLines(item), places);
	}

	function copy(text) {
		navigator.clipboard.writeText(text).then(
			() => studio.toast('已复制'),
			() => {
				const area = document.createElement('textarea');
				area.value = text;
				document.body.append(area);
				area.select();
				document.execCommand('copy');
				area.remove();
				studio.toast('已复制');
			},
		);
	}

	/** To the note it is in: at the block (its first line), or at where the file is named in it. */
	function jump(item, place) {
		const find = place.path ?? firstLine(item.text);
		studio.openPage(place.slug, { find }).catch((error) => studio.toast(error.message));
	}

	function select(id) {
		state.selected = id;
		for (const row of document.querySelectorAll('.item')) row.setAttribute('aria-selected', String(row.dataset.id === id));
		drawDetail(state.items.find((item) => item.id === id));
		document.body.classList.add('reading');
	}

	function draw() {
		const list = shown();
		drawLanguages();
		drawList(list);
		const all = ofKinds();
		const notes = new Set(all.flatMap((item) => item.places.map((place) => place.slug))).size;
		$('count').textContent = list.length === all.length ? `${all.length} 段，来自 ${notes} 篇笔记` : `找到 ${list.length} 段`;
		if (!list.some((item) => item.id === state.selected)) state.selected = list[0]?.id ?? null;
		for (const row of document.querySelectorAll('.item')) row.setAttribute('aria-selected', String(row.dataset.id === state.selected));
		drawDetail(state.items.find((item) => item.id === state.selected));
	}

	async function load() {
		try {
			state.items = await studio.notes.code();
		} catch (error) {
			$('list').textContent = `读不到笔记里的代码：${error.message}`;
			return;
		}
		draw();
	}

	$('query').addEventListener('input', (event) => {
		state.query = event.target.value;
		draw();
	});
	for (const [id, key] of [['blocks', 'blocks'], ['files', 'files'], ['others', 'others']]) {
		$(id).checked = state[key];
		$(id).addEventListener('change', (event) => {
			state[key] = event.target.checked;
			keep();
			draw();
		});
	}
	$('order').value = state.order;
	$('order').addEventListener('change', (event) => {
		state.order = event.target.value;
		keep();
		draw();
	});
	// / to search; ↑ ↓ through the list; Enter to the note; Esc clears the search.
	// 仓库 | 片段: the one shown kept for next time.
	const showTab = (which) => {
		$('repos').hidden = which !== 'repos';
		$('snippets').hidden = which !== 'snippets';
		$('tab-repos').setAttribute('aria-selected', String(which === 'repos'));
		$('tab-snippets').setAttribute('aria-selected', String(which === 'snippets'));
		localStorage.setItem('code-library.tab', which);
	};
	$('tab-repos').addEventListener('click', () => showTab('repos'));
	$('tab-snippets').addEventListener('click', () => showTab('snippets'));
	showTab(localStorage.getItem('code-library.tab') === 'snippets' ? 'snippets' : 'repos');
	addEventListener('keydown', (event) => {
		if ($('snippets').hidden) return;
		const typing = event.target instanceof HTMLInputElement && event.target.type !== 'checkbox';
		if (event.key === '/' && !typing) {
			event.preventDefault();
			$('query').focus();
		} else if (event.key === 'Escape' && typing && state.query) {
			$('query').value = state.query = '';
			draw();
		} else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
			const rows = [...document.querySelectorAll('.item')];
			if (!rows.length) return;
			event.preventDefault();
			const at = rows.findIndex((row) => row.dataset.id === state.selected);
			const next = rows[Math.min(rows.length - 1, Math.max(0, at + (event.key === 'ArrowDown' ? 1 : -1)))];
			select(next.dataset.id);
			next.scrollIntoView({ block: 'nearest' });
		} else if (event.key === 'Enter' && state.selected) {
			const item = state.items.find((each) => each.id === state.selected);
			if (item) jump(item, item.places[0]);
		}
	});
	studio.notes.onChange(load);
	load();
</script>
