<style>
	body { padding: 12px 14px; }
	.grid { display: grid; grid-template-columns: 72px 1fr; gap: 7px 10px; align-items: center; }
	.grid label { color: var(--muted); font-size: 12px; }
	.grid select, .grid input { width: 100%; box-sizing: border-box; }
	.pair { display: flex; gap: 8px; }
	textarea { box-sizing: border-box; width: 100%; height: 120px; font: 12px/1.45 ui-monospace, Menlo, monospace; }
	pre { margin: 10px 0; padding: 8px 10px; overflow: auto; max-height: 170px; border-radius: 6px; background: var(--soft); font: 12px/1.45 ui-monospace, Menlo, monospace; }
	.actions { display: flex; gap: 8px; }
	.problem { color: #b42318; font-size: 12px; }
</style>
<div class="grid">
	<label for="job">任务</label>
	<select id="job">
		<option value="opt freq">优化 + 频率</option>
		<option value="sp">单点能</option>
		<option value="ts">过渡态（优化 + 频率）</option>
		<option value="irc">IRC</option>
	</select>
	<label for="method">方法</label>
	<select id="method"><option>B3LYP</option><option>M062X</option><option>wB97XD</option><option>PBE1PBE</option><option>B2PLYPD3</option></select>
	<label for="basis">基组</label>
	<select id="basis"><option>def2SVP</option><option>def2TZVP</option><option>6-31G(d)</option><option>6-311+G(d,p)</option><option>def2QZVP</option></select>
	<label for="dispersion">色散</label>
	<select id="dispersion"><option value="GD3BJ">D3(BJ)</option><option value="GD3">D3(0)</option><option value="">不加</option></select>
	<label for="solvent">溶剂（SMD）</label>
	<select id="solvent"><option value="">气相</option><option>Water</option><option>Methanol</option><option>Acetonitrile</option><option>DiChloroMethane</option><option>Toluene</option><option>THF</option></select>
	<label>电荷 / 多重度</label>
	<div class="pair"><input id="charge" type="number" value="0" aria-label="电荷" /><input id="mult" type="number" value="1" min="1" aria-label="多重度" /></div>
	<label>核数 / 内存</label>
	<div class="pair"><input id="cores" type="number" value="16" min="1" aria-label="核数" /><input id="memory" type="text" value="32GB" aria-label="内存" /></div>
	<label for="title">标题</label>
	<input id="title" type="text" value="job" />
	<label for="source">结构</label>
	<select id="source"><option value="">粘贴在下面（XYZ）</option></select>
</div>
<textarea id="xyz" placeholder="XYZ：第一行原子数、第二行注释也行，或者只写「元素 x y z」" aria-label="结构"></textarea>
<p id="problem" class="problem" hidden></p>
<pre id="preview"></pre>
<div class="actions">
	<button id="insert">插入到正文</button>
	<button id="save">存成 assets/ 里的 .gjf</button>
</div>
<script>
	const $ = (id) => document.getElementById(id);
	const fields = ['job', 'method', 'basis', 'dispersion', 'solvent', 'charge', 'mult', 'cores', 'memory', 'title', 'xyz'];

	/** The atoms of XYZ text: the lines that are an element and three numbers. */
	function atoms(text) {
		return text.split('\n').map((line) => line.trim().split(/\s+/)).filter((words) => words.length >= 4 && /^[A-Z][a-z]?$/.test(words[0]) && words.slice(1, 4).every((word) => Number.isFinite(Number(word)))).map((words) => `${words[0].padEnd(2)} ${words.slice(1, 4).map((word) => Number(word).toFixed(6).padStart(12)).join(' ')}`);
	}

	function route() {
		const job = { 'opt freq': 'opt freq', sp: 'sp', ts: 'opt=(ts,calcfc,noeigentest) freq', irc: 'irc=(calcfc,maxpoints=30)' }[$('job').value];
		const parts = [`#p ${$('method').value}/${$('basis').value}`, job];
		if ($('dispersion').value && !/^B2PLYPD3$/.test($('method').value)) parts.push(`em=${$('dispersion').value}`);
		if ($('solvent').value) parts.push(`scrf=(smd,solvent=${$('solvent').value.toLowerCase()})`);
		return parts.join(' ');
	}

	function input() {
		const lines = atoms($('xyz').value);
		$('problem').hidden = Boolean(lines.length);
		$('problem').textContent = lines.length ? '' : '还没有结构：从上面选文章里的 XYZ，或者粘贴坐标。';
		return [`%nprocshared=${$('cores').value}`, `%mem=${$('memory').value}`, `%chk=${$('title').value}.chk`, route(), '', $('title').value || 'job', '', `${$('charge').value} ${$('mult').value}`, ...lines, '', ''].join('\n');
	}

	function draw() {
		$('preview').textContent = input();
		studio.storage.set('choices', Object.fromEntries(fields.filter((id) => id !== 'xyz').map((id) => [id, $(id).value])));
	}

	$('insert').addEventListener('click', () => studio.insert(`\`\`\`gaussian\n${input().trimEnd()}\n\`\`\``).catch((error) => studio.toast(error.message)));
	$('save').addEventListener('click', async () => {
		const name = `${($('title').value || 'job').replace(/[^\w.-]+/g, '-')}.gjf`;
		try {
			const path = await studio.files.write(`assets/${name}`, input());
			studio.toast(`已存成 ${path}`);
		} catch (error) {
			studio.toast(error.message);
		}
	});
	$('source').addEventListener('change', async () => {
		if (!$('source').value) return;
		try {
			$('xyz').value = await studio.files.read($('source').value);
			$('title').value = $('source').value.split('/').pop().replace(/\.xyz$/i, '');
		} catch (error) {
			studio.toast(error.message);
		}
		draw();
	});
	for (const id of fields) $(id).addEventListener('input', draw);

	(async () => {
		// What was chosen last time; the article's XYZ files to take a structure from.
		const kept = await studio.storage.get('choices');
		if (kept) for (const [id, value] of Object.entries(kept)) if ($(id)) $(id).value = value;
		try {
			for (const file of await studio.files.list()) if (file.kind === 'file' && /\.xyz$/i.test(file.path)) $('source').append(new Option(file.path, file.path));
		} catch {
			// No article open: pasted only.
		}
		draw();
	})();
</script>
