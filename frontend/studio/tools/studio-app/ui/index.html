<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>RetainPDF</title>
<style>
	:root { color-scheme: light dark; --ink: #37352f; --muted: #787774; --paper: #ffffff; }
	@media (prefers-color-scheme: dark) { :root { --ink: #d4d4d4; --muted: #9b9b9b; --paper: #191919; } }
	html, body { height: 100%; margin: 0; }
	body {
		display: grid; place-items: center; background: var(--paper); color: var(--ink);
		font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; cursor: default; user-select: none;
	}
	main { max-width: 560px; padding: 24px; text-align: center; }
	#status { color: var(--muted); white-space: pre-wrap; }
	.error #status { color: #e03e3e; text-align: left; user-select: text; font-size: 13px; }
	.error .hint { display: block; }
	.hint { display: none; margin-top: 16px; color: var(--muted); font-size: 13px; }
	#choices { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
	#choices a { padding: 5px 14px; border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius: 7px; color: var(--ink); font-size: 13px; text-decoration: none; }
	#choices a:hover { background: color-mix(in srgb, var(--muted) 12%, transparent); }
	#choices a.first { border-color: var(--ink); }
</style>
</head>
<body>
<main>
	<p id="status">正在找博客的服务器…</p>
	<p class="hint">关掉这个应用（⌘Q）再打开就会重试。</p>
	<p id="choices"></p>
</main>
<script>
	// What the app offers besides its message (main.rs): each a link it takes (studio-action://…), not a page.
	const CHOICES = {
		rescue: '用上次能正常启动的版本打开',
		wait: '再等等',
	};
	window.studioStatus = (message, error, choices = []) => {
		if (message) document.getElementById('status').textContent = message;
		document.body.classList.toggle('error', error);
		document.getElementById('choices').replaceChildren(...choices.filter((choice) => CHOICES[choice]).map((choice, index) => {
			const link = document.createElement('a');
			link.href = `studio-action://${choice}`;
			link.textContent = CHOICES[choice];
			if (index === 0) link.className = 'first';
			return link;
		}));
	};
</script>
</body>
</html>
