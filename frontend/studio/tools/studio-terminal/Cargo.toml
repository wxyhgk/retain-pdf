[package]
name = "studio-terminal"
version = "0.1.0"
edition = "2021"
description = "The Studio's terminal: shells in a PTY, served over WebSocket to the local writing page"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
libc = "0.2"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time"] }

[profile.release]
strip = true
